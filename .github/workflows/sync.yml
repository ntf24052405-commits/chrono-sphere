name: Live sync
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'scripts/**', '.github/workflows/sync.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest deadline news
        run: python scripts/fetch_feeds.py
      - name: Save feed to the repo (only when headlines changed)
        run: |
          git config user.name "chrono-sphere-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet || (git commit -m "feed: new headlines $(date -u +%FT%TZ)" && git push)
      - name: Build site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/data
          python scripts/fetch_feeds.py --stamp _site/data/feed.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
